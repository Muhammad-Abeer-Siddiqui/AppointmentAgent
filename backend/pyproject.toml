[project]
name = "ai-scheduler-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]==0.109.2",
    "fastapi-cli>=0.0.4",
    "uvicorn[standard]==0.27.1",
    "gunicorn==21.2.0",
    "sqlalchemy==2.0.25",
    "psycopg2-binary==2.9.9",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.6",
    "pydantic-settings==2.1.0",
    "pytz==2024.1",
    "python-dotenv==1.0.0",
    "requests==2.31.0",
    "google-auth-oauthlib==1.2.0",
    "google-auth==2.27.0",
    "google-api-python-client==2.108.0",
    "httpx==0.25.2",
    "google-genai==1.0.0",
]

[tool.fastapi-cloud]
app = "app.main:app"
python-version = "3.12"
